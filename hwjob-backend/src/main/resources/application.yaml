server:
  port: 8080
  servlet:
    context-path: /hwjob/api/
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hwjob_db

    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

    mongodb:
      uri: mongodb://root:root@localhost:27017
      username: root
      password: root
      database: hwjob-file

  messages:
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

initial-app:
  admin:
    username: admin
    password: admin
    name: Admin

api:
  api-province: https://provinces.open-api.vn/api/v2/

jwt:
  signerKey: 21d698ee57633eca2f364129be119e4e237079d8ab664b7a37d2006b92da62d6
  valid-duration: 3600
  refreshable-duration: 604800

app:
  file:
    storage-dir: upload/user-avatar/
    download-prefix: http://localhost:8080/hwjob/api/common/media/
    default-avatar-resource: static/images/default-avatar.png

