server:
  port: 8080
  servlet:
    context-path: /hwjob/api/
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hwjob_db?createDatabaseIfNotExist=true

    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      uri: mongodb://root:root@localhost:27017/hwjob_mongo_db?authSource=admin
      username: root
      password: root
      database: hwjob_mongo_db
      auto-index-creation: true

  messages:
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

