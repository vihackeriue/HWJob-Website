<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chat Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        input, button { padding: 8px; margin: 5px 0; }
        input { width: 200px; }
        button { cursor: pointer; }
        .section { border: 1px solid #ccc; padding: 15px; margin: 10px 0; }
        .msg-box { height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
        .msg { padding: 5px; margin: 3px 0; }
        .msg.mine { text-align: right; background: #e3f2fd; }
        .msg.other { text-align: left; background: #f5f5f5; }
        .conv-item { padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; }
        .conv-item:hover { background: #f0f0f0; }
        .conv-item.active { background: #d0d0d0; }
        .log { height: 100px; overflow-y: auto; background: #333; color: #0f0; padding: 10px; font-family: monospace; font-size: 12px; }
        .status { padding: 5px; margin: 5px 0; }
        .status.ok { color: green; }
        .status.err { color: red; }
    </style>
</head>
<body>
<h2>Chat Test</h2>

<div class="section">
    <h3>1. Đăng nhập</h3>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Đăng nhập</button>
    <br>
    <input type="text" id="manualToken" placeholder="Hoặc nhập token">
    <button onclick="useToken()">Dùng Token</button>
    <div id="loginStatus" class="status"></div>
</div>

<div class="section">
    <h3>2. WebSocket</h3>
    <button onclick="connectWS()">Kết nối WS</button>
    <div id="wsStatus" class="status">Chưa kết nối</div>
</div>

<div class="section">
    <h3>3. Conversations</h3>
    <button onclick="loadConvs()">Tải danh sách</button>
    <div id="convList"></div>
</div>

<div class="section">
    <h3>4. Chat: <span id="convName">-</span></h3>
    <div class="msg-box" id="msgList"></div>
    <input type="text" id="msgInput" placeholder="Nhập tin nhắn" disabled>
    <button id="sendBtn" onclick="sendMsg()" disabled>Gửi</button>
</div>

<div class="section">
    <h3>Log</h3>
    <div class="log" id="logBox"></div>
</div>

<script th:inline="javascript">
    const baseUrl = 'http://localhost:8080/hwjob/api';
    let token = null;
    let userId = null;
    let stompClient = null;
    let currentConvId = null;
    let subs = {};

    function log(msg) {
        const el = document.getElementById('logBox');
        el.innerHTML += '[' + new Date().toLocaleTimeString() + '] ' + msg + '\n';
        el.scrollTop = el.scrollHeight;
    }

    function authHeaders() {
        return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
    }

    async function login() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if (!u || !p) { alert('Nhập username/password'); return; }
        log('Đăng nhập: ' + u);
        try {
            const res = await fetch(baseUrl + '/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();
            if (data.result && data.result.accessToken) {
                token = data.result.accessToken;
                userId = parseJwt(token).sub;
                document.getElementById('loginStatus').textContent = 'OK - userId: ' + userId;
                document.getElementById('loginStatus').className = 'status ok';
                log('Đăng nhập thành công');
            } else {
                throw new Error(data.message || 'Login failed');
            }
        } catch (e) {
            document.getElementById('loginStatus').textContent = 'Lỗi: ' + e.message;
            document.getElementById('loginStatus').className = 'status err';
            log('Lỗi: ' + e.message);
        }
    }

    function useToken() {
        const t = document.getElementById('manualToken').value.trim();
        if (!t) { alert('Nhập token'); return; }
        try {
            token = t;
            userId = parseJwt(t).sub;
            document.getElementById('loginStatus').textContent = 'OK - userId: ' + userId;
            document.getElementById('loginStatus').className = 'status ok';
            log('Token OK');
        } catch (e) {
            document.getElementById('loginStatus').textContent = 'Token không hợp lệ';
            document.getElementById('loginStatus').className = 'status err';
        }
    }

    function parseJwt(t) {
        return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    }

    function connectWS() {
        if (!token) { alert('Đăng nhập trước'); return; }
        log('Kết nối WebSocket...');
        const socket = new SockJS(baseUrl + '/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;
        stompClient.connect({ Authorization: 'Bearer ' + token },
            function() {
                document.getElementById('wsStatus').textContent = 'Đã kết nối';
                document.getElementById('wsStatus').className = 'status ok';
                log('WebSocket connected');
            },
            function(err) {
                document.getElementById('wsStatus').textContent = 'Lỗi: ' + err;
                document.getElementById('wsStatus').className = 'status err';
                log('WS error: ' + err);
            }
        );
    }

    async function loadConvs() {
        if (!token) { alert('Đăng nhập trước'); return; }
        log('Tải conversations...');
        try {
            const res = await fetch(baseUrl + '/chats', { headers: authHeaders() });
            const data = await res.json();
            const convs = data.result || [];
            const el = document.getElementById('convList');
            if (!convs.length) { el.innerHTML = 'Không có conversation'; return; }
            el.innerHTML = convs.map(c =>
                '<div class="conv-item" id="conv-' + c.id + '" onclick="selectConv(\'' + c.id + '\',\'' + (c.conversationName || 'Chat').replace(/'/g, "\\'") + '\')">' +
                (c.conversationName || c.id) + '</div>'
            ).join('');
            log('Loaded ' + convs.length + ' conversations');
        } catch (e) {
            log('Lỗi: ' + e.message);
        }
    }

    async function selectConv(convId, name) {
        log('Chọn: ' + convId);
        document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
        const el = document.getElementById('conv-' + convId);
        if (el) el.classList.add('active');
        document.getElementById('convName').textContent = name;
        currentConvId = convId;
        subscribeConv(convId);
        await loadMsgs(convId);
        document.getElementById('msgInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
    }

    function subscribeConv(convId) {
        if (!stompClient || !stompClient.connected) { log('WS chưa kết nối'); return; }
        Object.values(subs).forEach(s => { try { s.unsubscribe(); } catch(e) {} });
        subs = {};
        log('Subscribe: /topic/conversation/' + convId);
        subs[convId] = stompClient.subscribe('/topic/conversation/' + convId, function(msg) {
            log('Nhận message từ WS');
            appendMsg(JSON.parse(msg.body));
        });
    }

    async function loadMsgs(convId) {
        try {
            const res = await fetch(baseUrl + '/chats/' + convId + '/messages', { headers: authHeaders() });
            const data = await res.json();
            const msgs = data.result || [];
            const el = document.getElementById('msgList');
            if (!msgs.length) { el.innerHTML = 'Chưa có tin nhắn'; return; }
            el.innerHTML = msgs.slice().reverse().map(createMsgHtml).join('');
            el.scrollTop = el.scrollHeight;
            log('Loaded ' + msgs.length + ' messages');
        } catch (e) {
            log('Lỗi: ' + e.message);
        }
    }

    function createMsgHtml(m) {
        const isMine = m.isMine || (m.sender && m.sender.userId === userId);
        const sender = m.sender ? m.sender.fullName : 'Unknown';
        const time = m.createdDate ? new Date(m.createdDate).toLocaleTimeString() : '';
        return '<div class="msg ' + (isMine ? 'mine' : 'other') + '">' +
            (!isMine ? '<b>' + sender + ':</b> ' : '') + m.message + ' <small>(' + time + ')</small></div>';
    }

    function appendMsg(m) {
        const el = document.getElementById('msgList');
        if (el.textContent === 'Chưa có tin nhắn') el.innerHTML = '';
        el.innerHTML += createMsgHtml(m);
        el.scrollTop = el.scrollHeight;
    }

    function sendMsg() {
        const input = document.getElementById('msgInput');
        const msg = input.value.trim();
        if (!msg || !currentConvId) return;
        log('Gửi: ' + msg);
        if (stompClient && stompClient.connected) {
            stompClient.send('/app/chat.send', { Authorization: 'Bearer ' + token },
                JSON.stringify({ conversationId: currentConvId, message: msg }));
        } else {
            sendViaRest(msg);
        }
        input.value = '';
    }

    async function sendViaRest(msg) {
        try {
            const res = await fetch(baseUrl + '/chats/messages', {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify({ conversationId: currentConvId, message: msg })
            });
            const data = await res.json();
            if (data.result) {
                log('Gửi REST OK');
            }
        } catch (e) {
            log('Lỗi gửi: ' + e.message);
        }
    }

    document.getElementById('msgInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMsg();
    });

    log('Ready - Base URL: ' + baseUrl);
</script>
</body>
</html>
