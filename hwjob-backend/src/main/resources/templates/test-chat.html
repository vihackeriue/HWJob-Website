<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chat Test - STOMPJS</title>

    <!-- SockJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .section {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 15px;
        }

        input, button {
            padding: 6px;
            margin: 5px 0;
        }

        .conv-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .conv-item:hover {
            background: #f5f5f5;
        }

        .conv-item.active {
            background: #ddd;
        }

        .msg-box {
            height: 300px;
            border: 1px solid #ccc;
            overflow-y: auto;
            padding: 10px;
        }

        .msg {
            margin: 5px 0;
        }

        .mine {
            text-align: right;
            color: blue;
        }

        .other {
            text-align: left;
            color: black;
        }

        .log {
            height: 120px;
            background: #111;
            color: #0f0;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
        }

        .ok { color: green; }
        .err { color: red; }
    </style>
</head>
<body>

<h2>Chat Test – @stomp/stompjs</h2>

<!-- LOGIN -->
<div class="section">
    <h3>1. Login</h3>
    <input id="username" placeholder="username">
    <input id="password" type="password" placeholder="password">
    <button onclick="login()">Login</button>
    <br>
    <input id="manualToken" placeholder="Hoặc nhập token">
    <button onclick="useToken()">Use Token</button>
    <div id="loginStatus"></div>
</div>

<!-- WS -->
<div class="section">
    <h3>2. WebSocket</h3>
    <div id="wsStatus">Chưa kết nối</div>
</div>

<!-- CREATE CONV -->
<div class="section">
    <h3>3. Create Conversation</h3>
    <input id="participantId" placeholder="Participant User ID">
    <button onclick="createConversation()">Create</button>
</div>

<!-- CONVERSATIONS -->
<div class="section">
    <h3>4. Conversations</h3>
    <button onclick="loadConvs()">Load</button>
    <div id="convList"></div>
</div>

<!-- CHAT -->
<div class="section">
    <h3>5. Chat: <span id="convName">-</span></h3>
    <div id="msgList" class="msg-box"></div>
    <input id="msgInput" placeholder="Nhập tin nhắn" disabled>
    <button id="sendBtn" onclick="sendMsg()" disabled>Send</button>
</div>

<!-- LOG -->
<div class="section">
    <h3>Log</h3>
    <div id="logBox" class="log"></div>
</div>

<!-- SCRIPT -->
<script type="module">
    import { Client } from "https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/+esm";

    const baseUrl = 'http://localhost:8080/hwjob/api';

    let token = null;
    let userId = null;
    let wsClient = null;
    let currentConvId = null;
    let subscriptions = {};

    /* ================= UTIL ================= */

    function log(msg) {
        const el = document.getElementById('logBox');
        el.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
        el.scrollTop = el.scrollHeight;
    }

    function authHeaders() {
        return {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
        };
    }

    function parseJwt(t) {
        return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    }

    /* ================= AUTH ================= */

    async function login() {
        const u = username.value;
        const p = password.value;

        const res = await fetch(baseUrl + '/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: u, password: p})
        });

        const data = await res.json();
        token = data.result.accessToken;
        userId = parseJwt(token).sub;

        loginStatus.textContent = 'Login OK: ' + userId;
        loginStatus.className = 'ok';

        connectWS();
    }

    function useToken() {
        token = manualToken.value.trim();
        userId = parseJwt(token).sub;

        loginStatus.textContent = 'Token OK: ' + userId;
        loginStatus.className = 'ok';

        connectWS();
    }

    /* ================= WS ================= */

    function connectWS() {
        wsClient = new Client({
            webSocketFactory: () => new SockJS(baseUrl + '/ws'),
            connectHeaders: { Authorization: 'Bearer ' + token },
            reconnectDelay: 5000,
            debug: () => {},

            onConnect: () => {
                wsStatus.textContent = 'Đã kết nối';
                wsStatus.className = 'ok';
                log('WS connected');
            },

            onWebSocketClose: () => {
                wsStatus.textContent = 'Mất kết nối';
                wsStatus.className = 'err';
            }
        });

        wsClient.activate();
    }

    /* ================= CONVERSATION ================= */

    async function createConversation() {
        const pid = participantId.value.trim();
        if (!pid) return;

        const res = await fetch(baseUrl + '/chats', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({
                type: 'DIRECT',
                participantIds: [pid]
            })
        });

        const data = await res.json();
        log('Create conv: ' + data.result.id);
        loadConvs();
    }

    async function loadConvs() {
        const res = await fetch(baseUrl + '/chats', {headers: authHeaders()});
        const data = await res.json();

        convList.innerHTML = data.result.map(c =>
            `<div class="conv-item" id="conv-${c.id}"
                 onclick="selectConv('${c.id}', '${c.conversationName || c.id}')">
                 ${c.conversationName || c.id}
             </div>`
        ).join('');
    }

    window.selectConv = async function (id, name) {
        currentConvId = id;
        convName.textContent = name;

        document.querySelectorAll('.conv-item').forEach(e => e.classList.remove('active'));
        document.getElementById('conv-' + id).classList.add('active');

        subscribeConv(id);
        loadMsgs(id);

        msgInput.disabled = false;
        sendBtn.disabled = false;
    }

    function subscribeConv(id) {
        Object.values(subscriptions).forEach(s => s.unsubscribe());
        subscriptions = {};

        subscriptions[id] = wsClient.subscribe(
            `/topic/conversation/${id}`,
            msg => appendMsg(JSON.parse(msg.body))
        );
    }

    /* ================= MESSAGE ================= */

    async function loadMsgs(id) {
        const res = await fetch(`${baseUrl}/chats/${id}/messages`, {headers: authHeaders()});
        const data = await res.json();

        msgList.innerHTML = data.result.reverse().map(createMsgHtml).join('');
    }

    function createMsgHtml(m) {
        const mine = m.sender?.userId === userId;
        return `<div class="msg ${mine ? 'mine' : 'other'}">
            ${mine ? '' : `<b>${m.sender.fullName}:</b> `}
            ${m.message}
        </div>`;
    }

    function appendMsg(m) {
        msgList.innerHTML += createMsgHtml(m);
        msgList.scrollTop = msgList.scrollHeight;
    }

    window.sendMsg = function () {
        const content = msgInput.value.trim();
        if (!content) return;

        wsClient.publish({
            destination: '/app/chat.send',
            headers: { Authorization: 'Bearer ' + token },
            body: JSON.stringify({
                conversationId: currentConvId,
                message: content
            })
        });

        msgInput.value = '';
    }

    msgInput.addEventListener('keypress', e => {
        if (e.key === 'Enter') sendMsg();
    });

    log('Ready');
</script>

</body>
</html>
